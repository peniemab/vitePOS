<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <rect width="512" height="512" rx="112" fill="none" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Centered symbol strictly within Android 80% maskable safe zone (410x410 box centered at 256,256) -->
  <!-- Concept: Stylized Bold 'V' that seamlessly integrates a high-speed transaction checkmark and lightning-fast retail slant -->
  <g transform="translate(256, 256)">
    <!-- Primary Navy bold dynamic V stroke / receipt fold -->
    <path d="M -130,-105 
             L -60,-105 
             L -20,60 
             L 50,-105 
             L 125,-105 
             L 10,125 
             C -2,145 -18,155 -35,155 
             C -52,155 -68,145 -80,125 
             Z" 
          fill="#1A2B4C" />
          
    <!-- Brick Red speed/pos checkmark accent cutting across dynamically -->
    <polygon points="-15,-30 40,-130 95,-130 15,20" fill="#B6171E" />
    
    <!-- Bold puncturing retail speed dot / confirmation node -->
    <circle cx="85" cy="-70" r="14" fill="#B6171E" />
  </g>
</svg>
